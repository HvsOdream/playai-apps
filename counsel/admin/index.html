<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>상담노트 사용 현황 · 관리자</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#e9edf1; --ink:#172029; --muted:#5d6b78; --line:#d5dce3;
  --accent:#1c5b78; --accent-ink:#ffffff; --accent-soft:#e1edf3;
  --rec:#c4423a; --ok:#2b7a58; --warn:#a8701a;
  --r:14px; --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Gowun Batang","Apple Myungjo","Nanum Myeongjo",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#181f26; --surface-2:#212a33; --ink:#e7ecf0; --muted:#98a5b1; --line:#2b353f;
  --accent:#7cb9d9; --accent-ink:#0f1418; --accent-soft:#1a2c38; --rec:#e0685f; --ok:#6cc39a; --warn:#dca24a;
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
main{max-width:820px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0;font-family:var(--serif);font-size:22px}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input.i{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;min-height:44px;font:inherit;color:inherit}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.dept{font-size:13px;color:var(--muted)}
.when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tot .big{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.hot{background:var(--warn)}
.bar i.full{background:var(--rec)}
.msg{margin-top:12px;font-size:14px;color:var(--rec)}
.empty{color:var(--muted);padding:22px 4px;text-align:center}
.note{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.6}
.busy{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>상담노트 사용 현황</h1>
  <div class="sub">교수님별 상담일지 생성 건수 · 관리자 전용</div>

  <div class="card" id="login">
    <div class="row">
      <div>
        <label class="f" for="key">관리자 암호</label>
        <input class="i" id="key" type="password" autocomplete="current-password" placeholder="Cloudflare에 등록한 ADMIN_KEY">
      </div>
      <div style="flex:0 0 auto"><button class="btn" id="go">조회</button></div>
    </div>
    <label class="chk"><input type="checkbox" id="remember"> 이 기기에서 암호 기억하기</label>
    <div class="msg" id="msg" hidden></div>
  </div>

  <div id="result" hidden>
    <div class="card">
      <div class="row" style="align-items:center">
        <div style="flex:0 0 auto">
          <label class="f" for="month">조회 월</label>
          <input class="i" id="month" type="month" style="min-width:170px">
        </div>
        <div style="flex:0 0 auto"><button class="btn ghost" id="reload">다시 조회</button></div>
      </div>
    </div>

    <div class="card">
      <div class="sub">이달 전체 사용</div>
      <div class="tot"><span class="big" id="t-total">0</span><span class="sub" id="t-limit"></span></div>
      <div class="bar"><i id="t-bar" style="width:0%"></i></div>
      <div class="sub" id="t-codes" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="sub" style="margin-bottom:4px">교수님별</div>
      <table>
        <thead><tr><th>교수 · 학과</th><th class="n">건수</th><th>마지막 사용</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="none" hidden>이달 사용 기록이 없습니다</div>
    </div>

    <div class="note">
      상담 내용·학생 이름·녹취는 이 서버에 저장되지 않습니다. 남는 것은 <b>접속 코드 · 교수 이름 · 학과 · 건수 · 사용 시각</b>뿐이며,
      교수 이름은 각자 설정 화면에 입력한 값입니다(입력하지 않은 분은 「이름 미입력」으로 묶입니다).
      기록은 약 13개월 뒤 자동 삭제됩니다. · <a href="../">상담노트로 돌아가기</a>
    </div>
  </div>
</main>

<script>
const WORKER_FALLBACK='https://counsel-ai.withsky0.workers.dev';
let worker=WORKER_FALLBACK;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=iso=>{ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—';
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

(async()=>{
  try{ const r=await fetch('../config.json',{cache:'no-store'}); if(r.ok){ const c=await r.json(); if(c.worker) worker=String(c.worker).replace(/\/+$/,''); } }catch(e){}
  const saved=(()=>{ try{ return localStorage.getItem('cn.adminkey')||''; }catch(e){ return ''; } })();
  if(saved){ $('key').value=saved; $('remember').checked=true; load(); }
})();

$('month').value=new Date().toISOString().slice(0,7);
$('go').onclick=load;
$('reload').onclick=load;
$('key').addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });
$('month').addEventListener('change',load);

async function load(){
  const key=$('key').value.trim();
  if(!key){ show('관리자 암호를 입력하세요'); return; }
  const btn=$('go'); btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="busy"></span>';
  show('');
  try{
    const r=await fetch(worker+'/stats',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({adminKey:key,month:$('month').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ show(j.error||('조회 실패 (HTTP '+r.status+')')); $('result').hidden=true; return; }
    try{ $('remember').checked?localStorage.setItem('cn.adminkey',key):localStorage.removeItem('cn.adminkey'); }catch(e){}
    render(j);
  }catch(e){ show('서버에 연결할 수 없습니다'); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
function show(m){ const el=$('msg'); el.hidden=!m; el.textContent=m; }

function render(j){
  $('result').hidden=false;
  if($('month').value!==j.month) $('month').value=j.month;
  const users=Array.isArray(j.users)?j.users:[];
  const totals=j.totals||{};
  const sum=Object.values(totals).reduce((a,b)=>a+Number(b||0),0);
  const limit=Number(j.limit||0);
  $('t-total').textContent=sum.toLocaleString()+'건';
  $('t-limit').textContent=limit?`/ 코드당 월 한도 ${limit.toLocaleString()}건`:'';
  const codes=Object.keys(totals);
  const worst=codes.length&&limit?Math.max(...codes.map(c=>Number(totals[c]||0)))/limit:0;
  const bar=$('t-bar'); bar.style.width=Math.min(100,Math.round(worst*100))+'%';
  bar.className=worst>=1?'full':worst>=.8?'hot':'';
  $('t-codes').innerHTML=codes.length?codes.map(c=>`<b>${esc(c)}</b> ${Number(totals[c]||0).toLocaleString()}건`).join(' · '):'';
  $('rows').innerHTML=users.map(u=>`<tr>\n    <td><div class="name">${esc(u.prof||'이름 미입력')}</div><div class="dept">${esc([u.dept,u.code].filter(Boolean).join(' · '))}</div></td>\n    <td class="n">${Number(u.n||0).toLocaleString()}</td>\n    <td class="when">${esc(fmt(u.last))}</td></tr>`).join('');
  $('none').hidden=users.length>0;
}
</script>
</body>
</html>
