<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디지털 리터러시 진단 10문항</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1c2430; --sub:#5b6878;
    --line:#e3e8ef; --brand:#2563eb; --brand-soft:#e8efff;
    --ok:#0f9d58; --ok-soft:#e7f6ee; --no:#d93b3b; --no-soft:#fdecec;
    --shadow:0 2px 10px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:32px 16px 80px;
    background:var(--bg); color:var(--ink);
    font-family:"KoPubWorld돋움체","KoPubWorldDotum","Malgun Gothic","맑은 고딕",
                -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.65; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:800px;margin:0 auto;}

  header{margin-bottom:24px;}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:-.5px;}
  .lead{color:var(--sub);font-size:15px;margin:0;}
  .meta{margin-top:14px;font-size:13px;color:var(--sub);
        display:flex;gap:8px;flex-wrap:wrap;}
  .tag{background:var(--brand-soft);color:var(--brand);
       padding:3px 10px;border-radius:999px;font-weight:700;}

  .bar{position:sticky;top:0;z-index:10;background:var(--bg);
       padding:10px 0 12px;margin-bottom:8px;}
  .bar-inner{background:var(--card);border:1px solid var(--line);
       border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);
       display:flex;align-items:center;gap:12px;font-size:14px;}
  .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--brand);transition:width .3s ease;}
  .count{font-weight:700;white-space:nowrap;}

  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
     padding:22px 22px 18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;}
  .qno{font-weight:800;color:var(--brand);font-size:14px;
       background:var(--brand-soft);border-radius:8px;padding:2px 9px;white-space:nowrap;}
  .qcat{font-size:12px;color:var(--sub);border:1px solid var(--line);
        border-radius:99px;padding:1px 9px;}
  .qtext{font-size:17px;font-weight:700;margin:8px 0 14px;letter-spacing:-.3px;}
  .scenario{background:#f8fafc;border-left:3px solid var(--line);
            padding:10px 14px;border-radius:0 8px 8px 0;
            font-size:14.5px;color:#3a4757;margin:0 0 14px;}

  ul.opts{list-style:none;margin:0;padding:0;}
  ul.opts li{margin-bottom:8px;}
  button.opt{
    width:100%;text-align:left;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);
    display:flex;gap:10px;align-items:flex-start;
    transition:border-color .15s, background .15s;
  }
  button.opt:hover:not(:disabled){border-color:var(--brand);background:#fafcff;}
  button.opt:disabled{cursor:default;}
  .num{font-weight:800;color:var(--sub);min-width:18px;}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft);}
  .opt.correct .num{color:var(--ok);}
  .opt.wrong{border-color:var(--no);background:var(--no-soft);}
  .opt.wrong .num{color:var(--no);}
  .mark{margin-left:auto;font-weight:800;font-size:14px;}
  .opt.correct .mark{color:var(--ok);}
  .opt.wrong .mark{color:var(--no);}

  .exp{display:none;margin-top:14px;padding:14px 16px;border-radius:10px;
       background:#f8fafc;border:1px solid var(--line);font-size:14.5px;}
  .exp.show{display:block;}
  .exp b{color:var(--brand);}
  .exp .verdict{display:block;font-weight:800;margin-bottom:6px;font-size:14px;}
  .exp .verdict.o{color:var(--ok);}
  .exp .verdict.x{color:var(--no);}
  .exp .why{margin:8px 0 0;color:var(--sub);font-size:13.5px;}

  #result{display:none;background:var(--card);border:1px solid var(--line);
          border-radius:14px;padding:28px 24px;text-align:center;
          box-shadow:var(--shadow);margin-top:8px;}
  #result.show{display:block;}
  .score{font-size:42px;font-weight:800;letter-spacing:-1px;margin:6px 0;}
  .score span{font-size:22px;color:var(--sub);font-weight:700;}
  .grade{font-size:17px;font-weight:700;margin-bottom:6px;}
  .comment{color:var(--sub);font-size:14.5px;margin:0 auto;max-width:520px;}
  .retry{margin-top:20px;background:var(--brand);color:#fff;border:0;
         border-radius:10px;padding:11px 26px;font:inherit;font-weight:700;
         font-size:15px;cursor:pointer;}
  .retry:hover{background:#1d4fd8;}

  footer{margin-top:28px;text-align:center;font-size:12.5px;color:#93a0b0;}

  @media (max-width:520px){
    body{padding:20px 12px 60px;}
    h1{font-size:22px;}
    .q{padding:18px 16px 14px;}
    .qtext{font-size:16px;}
    button.opt{font-size:14.5px;padding:11px 12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>디지털 리터러시 진단 10문항</h1>
    <p class="lead">직장에서 실제로 마주치는 상황 위주로 골랐습니다. 한 문항씩 고르면 바로 채점되고, 해설이 열립니다.</p>
    <div class="meta">
      <span class="tag">정보 검증</span>
      <span class="tag">보안</span>
      <span class="tag">개인정보</span>
      <span class="tag">AI 활용</span>
      <span class="tag">저작권</span>
    </div>
  </header>

  <div class="bar">
    <div class="bar-inner">
      <span class="count"><span id="done">0</span> / 10 완료</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span class="count" id="live">정답 0</span>
    </div>
  </div>

  <div id="quiz"></div>

  <div id="result">
    <div class="grade" id="grade"></div>
    <div class="score"><span id="sc">0</span><span> / 10</span></div>
    <p class="comment" id="comment"></p>
    <button class="retry" onclick="location.reload()">다시 풀기</button>
  </div>

  <footer>디지털 리터러시 진단 · 직장인 연수용 · 2026</footer>
</div>

      "비밀번호가 걸린 카페 와이파이에 접속해 사내 시스템에 로그인한다 (VPN 미사용)",
      "휴대폰 테더링으로 연결해 작업한다",
      "회사에서 지정한 VPN을 켠 뒤 사내 시스템에 접속한다",
      "와이파이는 켜되 민감 작업은 하지 않고 뉴스만 읽는다"
    ],
    a: 0,
    exp: "카페 와이파이의 비밀번호는 <b>그 자리 모두가 아는 비밀번호</b>라 보호 효과가 거의 없습니다. 같은 망에 있는 사람이 트래픽을 엿보거나, 카페와 같은 이름의 <b>가짜 접속지점</b>을 띄워 접속을 가로챌 수 있습니다. 민감 작업은 테더링이나 VPN을 쓰는 것이 원칙입니다.",
    why: "요즘은 대부분 HTTPS라 통신 내용이 암호화되지만, 접속 대상·가짜 로그인 페이지 유도 같은 위험은 남습니다."
  },
  {
    cat: "정보 검증",
    q: "진위를 판단하는 방법으로 가장 적절한 것은?",
    scenario: "SNS에서 회사 대표가 실언하는 30초 영상을 봤습니다. 화질이 다소 낮고, 원 게시자가 누구인지 불분명합니다.",
    opts: [
      "입 모양과 목소리가 자연스러우면 진짜로 판단한다",
      "해당 발언이 이뤄졌다는 자리·일시를 특정하고, 원본 영상이나 공식 기록이 있는지 찾는다",
      "일단 팀 단톡방에 공유해 다른 사람들의 판단을 물어본다",
      "댓글에 조작이라는 반박이 없으면 진짜로 본다"
    ],
    a: 1,
    exp: "합성 영상의 품질은 이미 육안 판별을 넘어섰습니다. 그래서 판단 기준은 '영상이 자연스러운가'가 아니라 <b>'그 일이 실제로 있었다는 독립적 기록이 있는가'</b>로 옮겨가야 합니다. 자리·일시를 특정해 원본이나 다른 각도의 기록을 찾는 것이 핵심입니다.",
    why: "확인 전 공유는 그 자체로 확산에 가담하는 행위입니다. 특히 사내에서는 명예훼손 문제로 번질 수 있습니다."
  }
];

const GRADES = [
  { min: 9, title: "🏆 우수 — 실무 기준을 잘 갖추셨습니다",
    msg: "판단 기준이 안정적입니다. 팀 내에서 기준을 공유하는 역할을 맡아도 좋겠습니다." },
  { min: 7, title: "👍 양호 — 기본기는 충분합니다",
    msg: "핵심은 잡고 계십니다. 틀린 영역의 해설만 다시 읽어보면 실무에서 흔들릴 일은 거의 없습니다." },
  { min: 5, title: "📌 보통 — 몇 군데 손볼 곳이 있습니다",
    msg: "아는 것과 습관 사이에 틈이 있는 상태입니다. 특히 보안·개인정보 문항은 한 번 더 확인해 보세요." },
  { min: 0, title: "⚠️ 주의 — 기준을 다시 세울 시점입니다",
    msg: "지금 상태로는 피싱·정보 유출 상황에서 판단이 어려울 수 있습니다. 해설을 처음부터 차근히 읽어보시길 권합니다." }
];

let done = 0, score = 0;
const quiz = document.getElementById("quiz");

QUESTIONS.forEach((item, i) => {
  const box = document.createElement("div");
  box.className = "q";

  const opts = item.opts.map((t, j) =>
    `<li><button class="opt" data-q="${i}" data-i="${j}">
       <span class="num">${j + 1}</span><span class="txt">${t}</span><span class="mark"></span>
     </button></li>`).join("");

  box.innerHTML = `
    <div class="qhead">
      <span class="qno">Q${i + 1}</span>
      <span class="qcat">${item.cat}</span>
    </div>
    <div class="qtext">${item.q}</div>
    ${item.scenario ? `<p class="scenario">${item.scenario}</p>` : ""}
    <ul class="opts">${opts}</ul>
    <div class="exp" id="exp${i}">
      <span class="verdict"></span>
      <div>${item.exp}</div>
      <p class="why">💡 ${item.why}</p>
    </div>`;
  quiz.appendChild(box);
});

quiz.addEventListener("click", (e) => {
  const btn = e.target.closest("button.opt");
  if (!btn || btn.disabled) return;

  const qi = +btn.dataset.q, pick = +btn.dataset.i;
  const item = QUESTIONS[qi];
  const buttons = btn.closest(".q").querySelectorAll("button.opt");
  buttons.forEach(b => b.disabled = true);

  const right = pick === item.a;
  if (right) score++;
  done++;

  buttons[item.a].classList.add("correct");
  buttons[item.a].querySelector(".mark").textContent = "정답";
  if (!right) {
    btn.classList.add("wrong");
    btn.querySelector(".mark").textContent = "선택";
  }

  const exp = document.getElementById("exp" + qi);
  const verdict = exp.querySelector(".verdict");
  verdict.textContent = right ? "○ 맞았습니다" : "✕ 아쉽습니다 — 정답은 " + (item.a + 1) + "번";
  verdict.className = "verdict " + (right ? "o" : "x");
  exp.classList.add("show");

  document.getElementById("done").textContent = done;
  document.getElementById("live").textContent = "정답 " + score;
  document.getElementById("fill").style.width = (done * 10) + "%";

  if (done === QUESTIONS.length) finish();
});

function finish() {
  const g = GRADES.find(x => score >= x.min);
  document.getElementById("grade").textContent = g.title;
  document.getElementById("sc").textContent = score;
  document.getElementById("comment").textContent = g.msg;
  const box = document.getElementById("result");
  box.classList.add("show");
  box.scrollIntoView({ behavior: "smooth", block: "center" });
}
</script>
</body>
</html>
